name: Workflow and voice operations
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  workflow-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the actual operation dependencies
        run: >-
          python -m pip install
          dagster==1.13.1 elevenlabs==0.2.26 SpeechRecognition==3.10.1
          pandas==2.1.4 numpy==1.24.4 structlog==23.2.0 aiohttp==3.9.1
          pydantic==2.14.1 setuptools==83.0.0
          fastapi==0.143.0 httpx==0.28.1 starlette==1.7.0 httpx==0.27.2
          pytest==7.4.4 pytest-asyncio==0.23.2
      - name: Execute original contracts and real local Dagster graph
        run: >-
          python -m pytest -q
          tests/unit/test_services.py::TestVoiceOps
          tests/unit/test_services.py::TestWorkflowBuilder
          tests/integration/test_services_integration.py::TestWorkflowIntegration
          tests/e2e/test_comprehensive.py::TestLayer4APIVoiceOps::test_voice_ops_integration
          tests/workflow_voice
