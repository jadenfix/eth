name: Durable ontology GraphQL and Neo4j
on:
  pull_request:
    paths:
      - 'services/graph_api/**'
      - 'services/ontology/**'
      - 'tests/graph_api/**'
      - '.github/workflows/graph-ontology-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/graph-integration-test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graph-integration-test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 24
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graph-integration-test
      GRAPH_REQUIRE_NEO4J: '1'
      NO_PROXY: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the actual graph boundary dependencies
        run: python -m pip install neo4j==5.15.0 graphql-core==3.2.3 fastapi==0.108.0 httpx==0.26.0 pytest==7.4.4 pytest-asyncio==0.23.2
      - name: Real HTTP GraphQL, SQLite restart and Neo4j commit/reconnect
        run: python -m pytest tests/graph_api -q
